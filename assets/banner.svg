    <linearGradient id="line"><stop stop-color="#C084FC"/><stop offset="1" stop-color="#7C6BEE"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#4A3669" stroke-opacity=".33"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <path d="M0 359H1280" stroke="url(#line)" stroke-width="3"/>
