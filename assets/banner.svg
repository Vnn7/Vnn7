<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Vinicios Fondelis</title>
  <desc id="desc">Banner escuro com detalhes em lilás, terminal e diagrama de servidores. Infraestrutura, automação e desenvolvimento.</desc>
